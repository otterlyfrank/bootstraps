<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bootstraps">
  <!-- Monogram: zoomed face + straps + boots — fill plate -->
  <rect width="64" height="64" rx="14" fill="#161310"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#3a342c" stroke-width="1.5"/>

  <!-- body -->
  <ellipse cx="38" cy="40" rx="12" ry="14" fill="#1a1a1a"/>
  <!-- head large -->
  <circle cx="28" cy="28" r="14" fill="#f0c4a8"/>
  <ellipse cx="28" cy="30" rx="11" ry="10" fill="#e07060" opacity="0.55"/>
  <path fill="#1a1410" d="M15 24c2-9 9-14 16-13 5 1 9 4 10 9-3-2-5-3-8-2-4 1-7 3-10 6z"/>
  <!-- strain eyes -->
  <path d="M21 27c1.6 1.5 3.2 1.5 4.8 0" fill="none" stroke="#2a1a14" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M30 27c1.6 1.5 3.2 1.5 4.8 0" fill="none" stroke="#2a1a14" stroke-width="1.6" stroke-linecap="round"/>
  <!-- teeth -->
