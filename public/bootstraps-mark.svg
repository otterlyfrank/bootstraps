<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bootstraps — work boot">
  <defs>
    <linearGradient id="leather" x1="18" y1="12" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c4a06a"/>
      <stop offset="0.45" stop-color="#9a7340"/>
      <stop offset="1" stop-color="#6b4a28"/>
    </linearGradient>
    <linearGradient id="sole" x1="14" y1="48" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a241c"/>
      <stop offset="1" stop-color="#14110e"/>
    </linearGradient>
  </defs>
  <!-- plate -->
  <rect width="64" height="64" rx="14" fill="#161310"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="12.75" fill="none" stroke="#3a342c" stroke-width="1.5"/>

  <!-- boot body (side profile, facing right) -->
  <path fill="url(#leather)" d="
    M18 28
    C18 20 22 15 30 14
    C36 13 40 15 42 20
    L46 28
    C48 31 50 34 50 38
    L50 46
    C50 48 48.5 49.5 46.5 49.5
    L22 49.5
    C19.5 49.5 18 47.5 18 45
    Z"/>

  <!-- toe box highlight -->
  <path fill="#d4b07a" opacity="0.35" d="
    M40 28
    C43 30 46 33 47 37
    L47 42
    C47 43.5 46 44.5 44.5 44.5
    L40 44.5
    Z"/>

  <!-- ankle cuff -->
  <path fill="#8a6234" d="
    M20 22
    C22 17 26 14.5 31 14.2
    C36 14 39.5 16 41 20
    L39.5 22.5
    C38 19.5 35 17.8 31 18
    C26.5 18.2 23.5 20.5 22 24
    Z"/>

  <!-- sole + heel -->
  <path fill="url(#sole)" d="
    M18 46.5
    L50 46.5
    C51.5 46.5 52.5 47.5 52.5 49
    C52.5 51 51 52.5 49 52.5
    L20.5 52.5
    C18.5 52.5 17 51 17 49
    C17 47.5 17.5 46.5 18 46.5
    Z"/>
  <path fill="#0e0c0a" d="M18 50.2h32.5" stroke="#3a3228" stroke-width="0.8" opacity="0.9"/>

  <!-- heel counter -->
  <path fill="#7a5630" d="M18 36 L22 36 L22 46.5 L18 46.5 Z" opacity="0.85"/>

  <!-- laces / bootstraps (literally the straps) -->
  <path d="M28 20 L36 20" stroke="#e8dfd0" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M27.5 23.5 L36.5 23.5" stroke="#e8dfd0" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M27 27 L37 27" stroke="#e8dfd0" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M27 30.5 L36.5 30.5" stroke="#e8dfd0" stroke-width="1.3" stroke-linecap="round"/>
  <!-- pull loops (bootstraps) -->
  <path d="M29 15.5 C27 13 26.5 11 28.5 10.5 C30.5 10 31.5 12 31 14.5" fill="none" stroke="#8fad8a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M35 15.5 C37 13 37.5 11 35.5 10.5 C33.5 10 32.5 12 33 14.5" fill="none" stroke="#8fad8a" stroke-width="1.8" stroke-linecap="round"/>

  <!-- eyelets -->
  <circle cx="28" cy="20" r="1.1" fill="#2a241c" stroke="#c9b48a" stroke-width="0.6"/>
  <circle cx="36" cy="20" r="1.1" fill="#2a241c" stroke="#c9b48a" stroke-width="0.6"/>
  <circle cx="27.5" cy="23.5" r="1.1" fill="#2a241c" stroke="#c9b48a" stroke-width="0.6"/>
  <circle cx="36.5" cy="23.5" r="1.1" fill="#2a241c" stroke="#c9b48a" stroke-width="0.6"/>
  <circle cx="27" cy="27" r="1.1" fill="#2a241c" stroke="#c9b48a" stroke-width="0.6"/>
  <circle cx="37" cy="27" r="1.1" fill="#2a241c" stroke="#c9b48a" stroke-width="0.6"/>

  <!-- small climb chevron (subtle) -->
  <path d="M47 18 L50 21 L53 18" fill="none" stroke="#8fad8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
