  <!-- arms + straps (bold) -->
  <path d="M28 24 C22 14 20 10 24 8" fill="none" stroke="#f0c4a8" stroke-width="4" stroke-linecap="round"/>
  <path d="M34 26 C40 14 46 10 48 9" fill="none" stroke="#f0c4a8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="24" cy="8" r="3" fill="#f0c4a8"/>
  <circle cx="48" cy="9" r="3" fill="#f0c4a8"/>
  <path d="M24 8 C18 4 16 2 19 1 C22 0 27 5 28 9" fill="none" stroke="#b07840" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M48 9 C54 4 58 2 55 0.5 C52 -1 44 5 43 9" fill="none" stroke="#b07840" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M48 9 L50 48" fill="none" stroke="#d8c4a0" stroke-width="2" stroke-linecap="round"/>

  <!-- boots large -->
