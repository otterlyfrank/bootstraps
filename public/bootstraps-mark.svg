<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bootstraps — pull yourself up by the bootstraps">
  <!-- Dark plate (matches app chrome) -->
  <rect width="64" height="64" rx="14" fill="#161310"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="12.75" fill="none" stroke="#3a342c" stroke-width="1.5"/>

  <!-- Simplified bootstrap mascot: guy + boots + straps (reads as the joke at small sizes) -->
  <!-- Body -->
  <ellipse cx="36" cy="34" rx="10" ry="12" fill="#1a1a1a"/>
  <!-- Head -->
  <circle cx="28" cy="28" r="11" fill="#f0c4a8"/>
  <!-- Red strain blush -->
  <ellipse cx="28" cy="30" rx="9" ry="8" fill="#e07060" opacity="0.55"/>
  <!-- Hair -->
  <path fill="#1a1410" d="M18.5 24c1-7 6.5-11 12-10 4 0.5 7 3 8 7-2-1.5-4-2-6.5-1.5-3 0.5-5.5 2-7.5 4.5z"/>
  <!-- Eyes closed strain -->
  <path d="M23 27c1.2 1.2 2.4 1.2 3.6 0" fill="none" stroke="#2a1a14" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M29.5 27c1.2 1.2 2.4 1.2 3.6 0" fill="none" stroke="#2a1a14" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Gritted teeth -->
  <path d="M24.5 33.5h7" stroke="#2a1a14" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M25 33.2v1.8M28 33.2v1.8M31 33.2v1.8" stroke="#fff8f0" stroke-width="0.9"/>
  <!-- Sweat drops -->
  <ellipse cx="18" cy="26" rx="1.2" ry="1.8" fill="#7ec8e8" opacity="0.9"/>
  <ellipse cx="20" cy="21" rx="1" ry="1.4" fill="#7ec8e8" opacity="0.75"/>

  <!-- Arms up -->
  <path d="M30 26 C26 18 24 14 26 12" fill="none" stroke="#f0c4a8" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M34 28 C36 18 40 13 42 12" fill="none" stroke="#f0c4a8" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="26" cy="12" r="2.4" fill="#f0c4a8"/>
  <circle cx="42" cy="12" r="2.4" fill="#f0c4a8"/>

  <!-- Bootstrap straps (the joke) -->
  <path d="M26 12 C22 8 20 6 22 4 C24 2 28 6 29 11" fill="none" stroke="#b07840" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M42 12 C46 8 50 5 48 3 C46 1 40 6 39 11" fill="none" stroke="#b07840" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Strap down to right boot -->
  <path d="M42 12 L44 40" fill="none" stroke="#d8c4a0" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Left work boot (clear silhouette) -->
  <path fill="#a86b38" stroke="#2a1a10" stroke-width="1" d="
    M14 48
    C14 44 16 42 20 42
    L26 42
    C28 42 29 43 29 45
    L29 50
    C29 52 27.5 53 25.5 53
    L16 53
    C14.5 53 14 51.5 14 50
    Z"/>
  <path fill="#2a241c" d="M14 50.5h15v2.5c0 1-0.8 1.8-1.8 1.8H15.8c-1 0-1.8-0.8-1.8-1.8z"/>
  <!-- Right work boot -->
  <path fill="#a86b38" stroke="#2a1a10" stroke-width="1" d="
    M36 48
    C36 44 38 41 43 41
    L50 42
    C52 42.5 53 44 53 46
    L52.5 51
    C52.5 52.5 51 53.5 49.5 53.5
    L38 53
    C36.5 53 36 51.5 36 50
    Z"/>
  <path fill="#2a241c" d="M36 50.5h16.5v2.6c0 1-0.8 1.8-1.8 1.8H37.8c-1 0-1.8-0.8-1.8-1.8z"/>

  <!-- Motion ticks -->
  <path d="M12 50h2M11 47h2" stroke="#5a5048" stroke-width="1" stroke-linecap="round"/>
  <path d="M54 48h2M55 51h2" stroke="#5a5048" stroke-width="1" stroke-linecap="round"/>
</svg>
