<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Bootstraps — local-first job hunt optimization with dual resumes and rejection learning"
    />
    <meta name="theme-color" content="#0f1210" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bootstraps" />
    <title>Bootstraps</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- System fonts first (offline + fast LCP). Optional editorial webfonts load after paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=optional"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="icon" href="./public/bootstraps-mark.svg" type="image/svg+xml" />
    <link rel="icon" href="./public/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./public/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app" class="app">
      <div class="boot">
        <img class="boot-logo" src="./public/bootstraps-logo.jpg" alt="" width="140" height="140" />
        <p class="boot-mark">Bootstraps</p>
        <p class="boot-tagline">Pull yourself up—then keep climbing</p>
        <p class="muted">Loading your hunt cockpit…</p>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
